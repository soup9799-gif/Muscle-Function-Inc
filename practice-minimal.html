<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이OO — Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#000; --ink-soft:#555; --line:#e5e5e5;
  --accent:#2d5be3;
  --content:1200px;
  --gut:24px;
  --sec-y:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:#fff;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.shell{max-width:var(--content);margin:0 auto;padding:0 5%}

/* header */
header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
header.site .shell{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font-size:18px;font-weight:800}
nav.main{display:flex;gap:40px}
nav.main a{font-size:14px;font-weight:500;color:var(--ink-soft)}
nav.main a:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;font-size:15px;font-weight:700;padding:14px 28px;border-radius:999px;border:0;cursor:pointer;font-family:inherit;color:#fff}
.btn-accent{background:var(--accent)}
.btn-dark{background:var(--ink)}
.btn:hover{opacity:.85}

/* sections */
.sec{padding:var(--sec-y) 0}
.sec-title{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.25}

/* hero */
.hero p{font-size:18px;color:var(--ink-soft);margin:24px 0 40px}
.hero h1{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.25}

/* projects */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gut);margin-top:60px}
.proj-art{aspect-ratio:4/3;border-radius:12px;overflow:hidden;margin-bottom:20px}
.proj-art img{width:100%;height:100%;object-fit:cover}
.proj-card h3{font-size:20px;font-weight:800;margin-bottom:6px}
.proj-card p{font-size:14px;color:var(--ink-soft)}

/* contact */
.contact{border-top:1px solid var(--line)}
.contact-form{display:flex;flex-direction:column;gap:20px;margin-top:60px;max-width:640px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:13px 14px;font-family:inherit;font-size:14px;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.contact-form .btn{align-self:flex-start}

footer.site{border-top:1px solid var(--line)}
footer.site .shell{padding:40px 5%;font-size:13px;color:var(--ink-soft)}

@media(max-width:960px){
  .proj-grid{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .hero h1,.sec-title{font-size:36px}
}
</style>
</head>
<body>

<header class="site">
  <div class="shell">
    <div class="logo">이OO</div>
    <nav class="main">
      <a href="#about">소개</a>
      <a href="#project">포트폴리오</a>
      <a href="#contact">문의</a>
    </nav>
  </div>
</header>

<section class="sec hero" id="about">
  <div class="shell">
    <h1>만든 것으로 증명하는<br>이OO의 포트폴리오</h1>
    <p>기획부터 배포까지 직접 구현한 프로젝트들을 모았습니다.</p>
    <a href="#project" class="btn btn-accent">포트폴리오 보기</a>
  </div>
</section>

<section class="sec" id="project">
  <div class="shell">
    <h2 class="sec-title">주요 프로젝트</h2>
    <div class="proj-grid">
      <div class="proj-card">
        <div class="proj-art"><img src="img/project-1.jpg" alt="오늘의 할일 앱"></div>
        <h3>오늘의 할일 앱</h3>
        <p>Supabase로 데이터를 저장하는 개인 투두리스트</p>
      </div>
      <div class="proj-card">
        <div class="proj-art"><img src="img/project-2.jpg" alt="팀 일정 공유 페이지"></div>
        <h3>팀 일정 공유 페이지</h3>
        <p>3인 팀 프로젝트, 역할을 나눠 화면별로 맡아 제작</p>
      </div>
      <div class="proj-card">
        <div class="proj-art"><img src="img/project-3.jpg" alt="무드보드 갤러리"></div>
        <h3>무드보드 갤러리</h3>
        <p>좋아하는 이미지를 모아두는 개인 갤러리 페이지</p>
      </div>
    </div>
  </div>
</section>

<section class="sec contact" id="contact">
  <div class="shell">
    <h2 class="sec-title">문의</h2>
    <form class="contact-form">
      <div class="field-row">
        <div class="field"><label>이름</label><input type="text" placeholder="이름을 입력해주세요."></div>
        <div class="field"><label>이메일</label><input type="email" placeholder="이메일을 입력해주세요."></div>
      </div>
      <div class="field"><label>문의 내용</label><textarea rows="5" placeholder="문의 내용을 입력해주세요."></textarea></div>
      <button type="submit" class="btn btn-dark">문의 보내기</button>
    </form>
  </div>
</section>

<footer class="site">
  <div class="shell">© 이OO</div>
</footer>

</body>
</html>
